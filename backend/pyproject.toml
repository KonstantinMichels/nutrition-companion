[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nutrition-companion-backend"
version = "0.1.0"
description = "Nutrition Companion modular-monolith API and deterministic nutrition engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.5,<2",
  "fastapi>=0.139.2,<0.140",
  "ortools==9.14.6206",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.14.2,<3",
  "psycopg[binary]>=3.3.4,<4",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
nutrition-seed = "app.modules.reference_data.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unused_ignores = true
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true
